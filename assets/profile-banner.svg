    <circle cx="762" cy="114" r="4"/>
    <circle cx="852" cy="114" r="4"/>
    <circle cx="900" cy="68" r="4"/>
    <circle cx="734" cy="140" r="4"/>
    <circle cx="852" cy="144" r="4"/>
    <circle cx="1001" cy="145" r="4"/>
    <circle cx="742" cy="224" r="4"/>

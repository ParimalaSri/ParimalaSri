<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Parimala Sri Sikhakolli — Data Engineer</title>
  <desc id="desc">A dark navy banner with subtle data-flow connections, cloud and database outlines, and cyan and violet accents. Text reads: Data Engineer | Data Integration | Exploring AI Engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.58" stop-color="#111a2d"/>
      <stop offset="1" stop-color="#101226"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.48"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a5b4fc" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#dots)" opacity="0.48"/>
  <ellipse cx="990" cy="180" rx="360" ry="250" fill="url(#glow)"/>


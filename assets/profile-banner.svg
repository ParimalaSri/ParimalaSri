    <text x="78" y="177" fill="#f8fafc" font-size="48" font-weight="650" letter-spacing="-1.4">Parimala Sri Sikhakolli</text>
    <text x="82" y="222" fill="#cbd5e1" font-size="22" font-weight="400">Data Engineer  |  Data Integration  |  Exploring AI Engineering</text>
